version: '3.8'

services:
  api:
    build: .
    container_name: crux-api
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    # If your MongoDB is running locally on the EC2 instance, you might want to uncomment this 
    # to allow the container to reach the host's localhost directly, or manage a DB service here.
    # network_mode: "host"
